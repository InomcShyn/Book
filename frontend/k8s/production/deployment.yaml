apiVersion: apps/v1
kind: Deployment
metadata:
  name: recon-cms
  namespace: reconsys-app
  labels:
    app: recon-cms
    environment: production
    version: "2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recon-cms
      environment: production
  template:
    metadata:
      labels:
        app: recon-cms
        environment: production
        version: "2.0"
    spec:
      containers:
      - name: recon-cms
        image: harbor.natcomstore.com/reconsys/cms:latest
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: VERSION
          value: "2.0"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
      restartPolicy: Always
      imagePullSecrets:
      - name: harbor-secret

---
apiVersion: v1
kind: Service
metadata:
  name: recon-cms-service
  namespace: reconsys-app
  labels:
    app: recon-cms
    environment: production
    version: "2.0"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: recon-cms
    environment: production

---
apiVersion: v1
kind: Service
metadata:
  name: recon-cms-node-port
  namespace: reconsys-app
  labels:
    app: recon-cms
    environment: production
    version: "2.0"
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
    nodePort: 31080
  selector:
    app: recon-cms
    environment: production
